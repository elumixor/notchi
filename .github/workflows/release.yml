name: Publish Release

# Builds the fork on a GitHub macOS runner and attaches the zipped app to a
# GitHub release, so a machine without Xcode can install it with
# scripts/install-release.sh. The app is ad-hoc signed and not notarised; the
# installer strips the quarantine flag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release
        run: |
          xcodebuild build \
            -project notchi/notchi.xcodeproj \
            -scheme notchi \
            -destination "platform=macOS" \
            -configuration Release \
            -derivedDataPath build/release \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_HARDENED_RUNTIME=NO \
            | tail -n 40
          test -d build/release/Build/Products/Release/notchi.app

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/release/Build/Products/Release/notchi.app dist/Notchi.app
          ditto -c -k --keepParent dist/Notchi.app dist/Notchi.zip
          shasum -a 256 dist/Notchi.zip | tee dist/Notchi.zip.sha256

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Ad-hoc signed build of the fork. Install with: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install-release.sh | bash" \
            dist/Notchi.zip dist/Notchi.zip.sha256

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Notchi
          path: dist/Notchi.zip
